name: AI feature intake

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Numéro de l’Issue à retraiter
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-feature-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Validate and normalize the request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[Feature IA]') ||
      contains(github.event.issue.body, '### Problème à résoudre')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      intake_status: ${{ steps.classify.outputs.intake_status }}

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Classify the feature request
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/feature-request-intake.mjs`,
            )
            const { handleFeatureRequest } = await import(moduleUrl.href)
            await handleFeatureRequest({ github, context, core })

  specify:
    name: Request an implementation-ready specification
    needs: normalize
    if: needs.normalize.outputs.intake_status == 'ai:ready-for-spec'
    uses: ./.github/workflows/ai-feature-spec.yml
    with:
      issue_number: ${{ format('{0}', github.event.issue.number || inputs.issue_number) }}
    secrets: inherit
